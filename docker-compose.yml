services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-os-postgres
    environment:
      POSTGRES_USER: ai_os
      POSTGRES_PASSWORD: ai_os_dev
      POSTGRES_DB: ai_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  sandbox:
    image: python:3.12-slim
    container_name: ai-os-sandbox
    working_dir: /work
    volumes:
      - .:/work
    command: sleep infinity

volumes:
  pgdata: